# .github/workflows/build.yml
# Quad Market Build — 4 builds paralelos por locale
# Secrets documentados em: docs/ci-cd-secrets.md
#
# Fluxo:
#   push para main → este workflow → artifacts build-{locale}
#   → deploy.yml (via workflow_run) → 4 deploys SFTP paralelos (BR/IT/EN/ES)
#   → job in-line post-deploy-smoke (em deploy.yml) → smoke tests dos 4 domínios
name: Quad Market Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.claude/**'
      - 'CHANGELOG*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs anteriores para o mesmo branch/PR
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # Outros locales continuam se um falhar
      matrix:
        locale: [pt-BR, it-IT, en, es-ES]
        include:
          - locale: pt-BR
            build_suffix: br
            site_url: https://forjadesistemas.com.br
            contact_email: contato@forjadesistemas.com.br
          - locale: it-IT
            build_suffix: it
            site_url: https://systemforge.it
            contact_email: contatto@systemforge.it
          - locale: en
            build_suffix: en
            site_url: https://systemforgesoftware.com
            contact_email: contact@systemforgesoftware.com
          - locale: es-ES
            build_suffix: es
            site_url: https://systemforge.es
            contact_email: hola@systemforge.es

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules + velite
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            .velite
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Cache npm + .next
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check content parity
        run: npx tsx scripts/check-content-parity.ts
        if: matrix.locale == 'pt-BR'   # roda uma vez (não precisa rodar 3×)

      - name: Validate frontmatter (${{ matrix.locale }})
        run: npm run prebuild:${{ matrix.build_suffix }}
        env:
          NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.site_url }}

      - name: Optimize images
        run: npm run optimize:images

      - name: Build content & search index
        run: npm run prebuild
        env:
          NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}

      - name: Build (${{ matrix.locale }})
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.site_url }}
          OUT_DIR: out
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ matrix.contact_email }}
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_BUDGET_ENGINE_URL: ${{ secrets.NEXT_PUBLIC_BUDGET_ENGINE_URL }}
          # Newsletter worker URLs: NEXT_PUBLIC_* precisa estar presente no passo
          # de build para ser embutido no bundle client. Sem isto config.newsletter
          # .workerUrl resolve para '' e o formulario nao submete em nenhum locale.
          NEXT_PUBLIC_NEWSLETTER_WORKER_URL_BR: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_WORKER_URL_BR }}
          NEXT_PUBLIC_NEWSLETTER_WORKER_URL_IT: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_WORKER_URL_IT }}
          NEXT_PUBLIC_NEWSLETTER_WORKER_URL_EN: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_WORKER_URL_EN }}
          NEXT_PUBLIC_NEWSLETTER_WORKER_URL_ES: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_WORKER_URL_ES }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.locale }}
          path: out/
          retention-days: 1
          if-no-files-found: error

  # ─── Post-build isolation check ────────────────────────────────────────────
  build-isolation-check:
    name: Build Isolation Check
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact (pt-BR)
        uses: actions/download-artifact@v4
        with:
          name: build-pt-BR
          path: dist-br/

      - name: Download build artifact (it-IT)
        uses: actions/download-artifact@v4
        with:
          name: build-it-IT
          path: dist-it/

      - name: Download build artifact (en)
        uses: actions/download-artifact@v4
        with:
          name: build-en
          path: dist-en/

      - name: Download build artifact (es-ES)
        uses: actions/download-artifact@v4
        with:
          name: build-es-ES
          path: dist-es/

      - name: Check build isolation (zero cross-contamination)
        run: npx tsx scripts/check-build-isolation.ts
        continue-on-error: true

      - name: Check broken links (internal only)
        run: npx tsx scripts/check-broken-links.ts --internal-only
        # TECH-DEBT: ~13.4k internal broken links — i18n routing incompleto
        # (app/ só tem slugs PT, configs IT/EN apontam pra /services, /servizi,
        # /blog/category/*, /blog/categorie/* sem páginas geradas) + links
        # artigo↔artigo apontando pra posts inexistentes. Resolução exige feature
        # dedicada (route aliases + content reconciliation). Ver PENDING-ACTIONS.md.
        continue-on-error: true

  # ─── Reconcile hreflang cross-locale (pos-matrix, pre-deploy) ──────────────
  # A matrix `build` produz 1 sitemap por locale, isolado. A reciprocidade
  # hreflang (NEXT-005) so e resolvivel vendo os 4 sitemaps juntos — um build
  # por-locale nao enxerga os irmaos. Este job junta os 4 artifacts, roda o
  # reconciliador (scripts/reconcile-sitemap-hreflang.ts), revalida fail-closed
  # e RE-SOBE os 4 artifacts (overwrite) para o deploy.yml shippar os sitemaps
  # ja reconciliados. Se a validacao falhar, o workflow falha e o deploy
  # (gated em workflow_run.conclusion == 'success') nao roda.
  reconcile-hreflang:
    name: Reconcile Hreflang Sitemaps (quad)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact (pt-BR)
        uses: actions/download-artifact@v4
        with:
          name: build-pt-BR
          path: dist-br/

      - name: Download build artifact (it-IT)
        uses: actions/download-artifact@v4
        with:
          name: build-it-IT
          path: dist-it/

      - name: Download build artifact (en)
        uses: actions/download-artifact@v4
        with:
          name: build-en
          path: dist-en/

      - name: Download build artifact (es-ES)
        uses: actions/download-artifact@v4
        with:
          name: build-es-ES
          path: dist-es/

      - name: Reconcile hreflang across the 4 sitemaps
        run: npm run reconcile:hreflang

      - name: Validate hreflang reciprocity (fail-closed)
        run: npm run validate:sitemap-hreflang

      - name: Re-upload reconciled artifact (pt-BR)
        uses: actions/upload-artifact@v4
        with:
          name: build-pt-BR
          path: dist-br/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Re-upload reconciled artifact (it-IT)
        uses: actions/upload-artifact@v4
        with:
          name: build-it-IT
          path: dist-it/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Re-upload reconciled artifact (en)
        uses: actions/upload-artifact@v4
        with:
          name: build-en
          path: dist-en/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Re-upload reconciled artifact (es-ES)
        uses: actions/upload-artifact@v4
        with:
          name: build-es-ES
          path: dist-es/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  # ─── Dispatch Deploy quando Build veio de workflow_dispatch (bot) ──────────
  # workflow_run nao dispara quando o Build foi triggado via GITHUB_TOKEN
  # (regra do GitHub Actions). Bot-driven flows precisam de dispatch explicito.
  # needs reconcile-hreflang: garante que o deploy so dispara com os sitemaps
  # ja reconciliados e validados (fail-closed).
  dispatch-deploy:
    name: Dispatch Quad Market Deploy
    needs: [build, reconcile-hreflang]
    if: ${{ github.event_name == 'workflow_dispatch' && success() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build veio de workflow_dispatch - disparando Quad Market Deploy"
          gh workflow run deploy.yml \
            --ref main \
            --repo ${{ github.repository }} \
            -f build_run_id=${{ github.run_id }}
