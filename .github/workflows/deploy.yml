          done >> "$BATCH_DIRS"
          echo "quit" >> "$BATCH_DIRS"
          sshpass -e sftp $SFTP_OPTS "$TARGET" < "$BATCH_DIRS"
          mapfile -t ALL_FILES < <(find out -type f | sort)
          TOTAL=${#ALL_FILES[@]}
          PARALLEL=5
          CHUNK=$(( (TOTAL + PARALLEL - 1) / PARALLEL ))
          echo "Uploading $TOTAL files in $PARALLEL parallel batches of ~$CHUNK files"
          PIDS=()
          for i in $(seq 0 $((PARALLEL - 1))); do
            BATCH=$(mktemp)
            START=$((i * CHUNK))
            for file in "${ALL_FILES[@]:$START:$CHUNK}"; do
              echo "put $file ${file/#out/$SFTP_PATH}"
            done >> "$BATCH"
            echo "quit" >> "$BATCH"
            sshpass -e sftp $SFTP_OPTS "$TARGET" < "$BATCH" &
            PIDS+=($!)
          done
          FAILED=0
          for pid in "${PIDS[@]}"; do
            wait "$pid" || FAILED=1
          done
          [ "$FAILED" -eq 0 ] || { echo "One or more upload batches failed"; exit 1; }

      - name: Purge Cloudflare cache (IT)
        if: success()
        run: |
          ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID_IT }}"
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          fi

      - name: Deploy summary (IT)
        if: success()
        run: |
          echo "## Deploy IT concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Domínio:** systemforge.it" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPLOY: Inglês (en) → systemforgesoftware.com
  # ===========================================================================
