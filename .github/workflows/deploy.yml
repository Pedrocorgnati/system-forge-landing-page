# .github/workflows/deploy.yml
# Quad Market Deploy — 4 SFTP deploys paralelos (BR, IT, EN, ES)
# Secrets documentados em: docs/ci-cd-secrets.md
#
# Pré-requisito: build.yml deve ter completado com sucesso (artifacts build-{locale} disponíveis)
# Trigger: workflow_run após "Quad Market Build" completar em main
# Manual: workflow_dispatch re-deploya os 4 mercados; input opcional build_run_id
#         reaproveita os artefatos de um build prévio (ver auto-publishable-blog.md §8)
name: Quad Market Deploy

on:
  workflow_run:
    workflows: ["Quad Market Build"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build run_id (passado por build.yml quando promote bot dispara o Deploy)'
        required: false
        default: ''

# Serializa deploys para o mesmo branch (enfileira, nao cancela).
# Cancel-in-progress=true causava SFTP em estado parcial quando um novo push
# chegava no meio do upload paralelo (5 sessoes por locale). Enfileirar
# garante que cada quad-deploy termine antes do proximo comecar.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # DEPLOY: Brasil (pt-BR) → forjadesistemas.com.br
  # ===========================================================================
  deploy-br:
    name: Deploy BR (forjadesistemas.com.br)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # V-02: lftp mirror --ignore-time sincroniza apenas arquivos com tamanho
    # diferente do remoto — evita reupload massivo de ~36k arquivos para 4 posts
    # novos. Timeout reduzido de 150→90 min; ajustar se locale crescer muito.
    timeout-minutes: 90

    steps:
      - name: Capture deploy start timestamp
        run: echo "DEPLOY_START_TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/generate-htaccess.ts
            package.json
            package-lock.json
            tsconfig.json
          sparse-checkout-cone-mode: false

      - name: Download build artifact (pt-BR)
        uses: actions/download-artifact@v4
        with:
          name: build-pt-BR
          path: out/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.build_run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Generate .htaccess (BR — LGPD)
        run: npx tsx scripts/generate-htaccess.ts --locale=br

      - name: Copy .htaccess into build output
        run: cp dist-br/.htaccess out/.htaccess

      - name: Verify security headers in .htaccess (BR)
        run: |
          grep -q "Strict-Transport-Security" out/.htaccess && echo "✅ HSTS present" || (echo "❌ HSTS missing" && exit 1)
          grep -q "X-Frame-Options" out/.htaccess && echo "✅ X-Frame-Options present" || (echo "❌ X-Frame-Options missing" && exit 1)
          grep -q "Content-Security-Policy" out/.htaccess && echo "✅ CSP present" || (echo "❌ CSP missing" && exit 1)
          grep -q "googletagmanager" out/.htaccess && echo "✅ GTM in CSP (expected for BR)" || (echo "❌ GTM missing from BR CSP" && exit 1)

      - name: Deploy to forjadesistemas.com.br
        env:
          SFTP_HOST: ${{ secrets.SFTP_BR_HOST }}
          SFTP_USER: ${{ secrets.SFTP_BR_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_BR_PASS }}
          SFTP_PORT: ${{ secrets.SFTP_BR_PORT }}
          SFTP_PATH: ${{ secrets.SFTP_BR_PUBLIC_HTML }}
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          LOCAL_COUNT=$(find out -type f | wc -l)
          echo "Arquivos no output local: $LOCAL_COUNT"
          # V-02: mirror --ignore-time compara por tamanho; pula arquivos com
          # tamanho idêntico ao remoto (evita reupload de conteúdo inalterado).
          # Cria diretórios remotos ausentes automaticamente.
          # V-03: retry loop (ate 3 tentativas). O SFTP da Hostinger as vezes
          # rejeita um lote de arquivos numa janela transitoria (SSH_FX_FAILURE
          # ~30s), fazendo o lftp sair 1 mesmo com a maioria enviada. Cada retry
          # com --ignore-time sobe so o que faltou; parallel reduzido 5->3 e
          # net:max-retries/timeout maiores reduzem a chance da janela ruim.
          deploy_ok=0
          for attempt in 1 2 3; do
            echo "=== lftp mirror -- tentativa $attempt/3 ==="
            if lftp -u "$SFTP_USER,$LFTP_PASSWORD" "sftp://${SFTP_HOST}:${SFTP_PORT}" -e \
              "set sftp:auto-confirm yes; \
               set net:max-retries 5; \
               set net:timeout 30; \
               set net:reconnect-interval-base 5; \
               mirror --reverse --parallel=3 --ignore-time --no-empty-dirs \
                      --log=/dev/stderr out/ ${SFTP_PATH}; \
               quit"; then
              deploy_ok=1; echo "mirror OK na tentativa $attempt"; break
            fi
            echo "mirror falhou na tentativa $attempt; backoff 15s antes do retry..."
            sleep 15
          done
          [ "$deploy_ok" = "1" ] || { echo "ERRO: lftp mirror falhou apos 3 tentativas"; exit 1; }
          echo "DEPLOY_FILE_COUNT=$LOCAL_COUNT" >> "$GITHUB_ENV"

      - name: Purge Cloudflare cache (BR)
        if: success()
        run: |
          ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          fi

      - name: Deploy summary (BR)
        if: success()
        run: |
          DEPLOY_END_TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "## Deploy BR concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| dominio | forjadesistemas.com.br |" >> "$GITHUB_STEP_SUMMARY"
          echo "| commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deploy_start_ts | $DEPLOY_START_TS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deploy_end_ts | $DEPLOY_END_TS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| files_in_output | ${DEPLOY_FILE_COUNT:-n/a} |" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # DEPLOY: Itália (it-IT) → systemforge.it
  # ===========================================================================
  deploy-it:
    name: Deploy IT (systemforge.it)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # V-02: lftp mirror --ignore-time. Ver comentário em deploy-br.
    timeout-minutes: 90

    steps:
      - name: Capture deploy start timestamp
