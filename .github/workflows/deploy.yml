  # ===========================================================================
  # POST-DEPLOY: Smoke Tests (4 domínios)
  # ===========================================================================
  post-deploy-smoke:
    name: Post-Deploy Smoke Tests
    needs: [deploy-br, deploy-it, deploy-en, deploy-es]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() && needs.deploy-br.result == 'success' && needs.deploy-it.result == 'success' && needs.deploy-en.result == 'success' && needs.deploy-es.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for CDN propagation
        run: sleep 60

      - name: Run smoke tests (básico — HTTP/lang/keyword/sitemap)
        run: bash scripts/smoke-test-full.sh

      - name: Run feature smoke tests (blog/contact/services)
        run: bash scripts/smoke-test-features.sh

      - name: Run worker smoke tests (newsletter Workers)
        env:
          WORKER_BR: ${{ secrets.NEWSLETTER_WORKER_URL_BR }}
          WORKER_IT: ${{ secrets.NEWSLETTER_WORKER_URL_IT }}
          WORKER_EN: ${{ secrets.NEWSLETTER_WORKER_URL_EN }}
          WORKER_ES: ${{ secrets.NEWSLETTER_WORKER_URL_ES }}
        run: |
          [ -n "$WORKER_BR" ] && bash scripts/smoke-test-workers.sh \
            || echo "⚠️ WORKER_BR/IT/EN/ES não configurados — pulando smoke-test-workers"

      - name: Smoke test summary
        if: always()
        run: |
          echo "## Post-Deploy Smoke Tests concluídos" >> $GITHUB_STEP_SUMMARY
