          fi

      - name: Deploy summary (EN)
        if: success()
        run: |
          echo "## Deploy EN concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Domínio:** systemforgesoftware.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPLOY: Espanha (es-ES) → systemforge.es
  # ===========================================================================
  deploy-es:
    name: Deploy ES (systemforge.es)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
