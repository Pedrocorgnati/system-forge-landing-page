          echo "## Deploy EN concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| dominio | systemforgesoftware.com |" >> "$GITHUB_STEP_SUMMARY"
