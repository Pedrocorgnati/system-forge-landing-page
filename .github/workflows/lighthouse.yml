name: Lighthouse CI

on:
  schedule:
    - cron: '0 3 * * 0'   # domingo 03h UTC
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: pt-BR
            build_suffix: br
            site_url: https://forjadesistemas.com.br
            contact_email: contato@forjadesistemas.com.br
            port: 3001
          - locale: it-IT
            build_suffix: it
            site_url: https://systemforge.it
            contact_email: contatto@systemforge.it
            port: 3002
          - locale: en
            build_suffix: en
            site_url: https://systemforgesoftware.com
            contact_email: contact@systemforgesoftware.com
            port: 3003

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache npm + .next
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      - name: Validate frontmatter (${{ matrix.locale }})
        run: npm run prebuild:${{ matrix.build_suffix }}
        env:
          NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.site_url }}

      - name: Optimize images
        run: npm run optimize:images

      - name: Build content & search index
        run: npm run prebuild
        env:
          NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}

      - name: Build (${{ matrix.locale }})
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.site_url }}
          OUT_DIR: out
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ matrix.contact_email }}
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_BUDGET_ENGINE_URL: ${{ secrets.NEXT_PUBLIC_BUDGET_ENGINE_URL }}

      - name: Install serve
        run: npm install -g serve

      - name: Serve static build (${{ matrix.locale }})
        run: serve out/ -p ${{ matrix.port }} &

      - name: Wait for server (${{ matrix.locale }})
        run: npx wait-on http://localhost:${{ matrix.port }} --timeout 30000

      - name: Run Lighthouse CI (${{ matrix.locale }})
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: lighthouserc.json
          urls: |
            http://localhost:${{ matrix.port }}
            http://localhost:${{ matrix.port }}/servicos
          uploadArtifacts: true
          artifactName: lighthouse-results-${{ matrix.build_suffix }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Performance gate check (${{ matrix.locale }})
        if: always()
        run: |
          if [ "${{ steps.lighthouse.outcome }}" = "failure" ]; then
            echo "Lighthouse CI FAILED for locale: ${{ matrix.locale }}"
            echo "Performance < 90 OR SEO < 95. Deploy blocked."
            exit 1
          fi
          echo "Performance gate PASSED for locale: ${{ matrix.locale }}"
