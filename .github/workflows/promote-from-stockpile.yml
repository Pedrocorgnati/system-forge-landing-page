name: promote-from-stockpile

on:
  schedule:
    - cron: '0 13 * * *'   # 13h UTC, 1h depois das routines obsoletas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-from-stockpile
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Promote (max-per-locale 3)
        env:
          MAX_PER_LOCALE: '3'
        run: npx tsx scripts/promote-from-stockpile.ts

      - name: Push (se houve commit)
        run: |
          git config user.email "actions@github.com"
          git config user.name "promote-from-stockpile bot"
          git push origin main || echo "no commit (no-op)"
