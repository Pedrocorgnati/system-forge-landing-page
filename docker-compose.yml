# Docker Compose — desenvolvimento local
# Uso: docker compose up
#
# O compose de dev NÃO usa o Dockerfile — monta volume e roda next dev
# diretamente para hot reload funcional.

services:
  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev"
    env_file:
      - .env.docker
    restart: unless-stopped

volumes:
  app_node_modules:
