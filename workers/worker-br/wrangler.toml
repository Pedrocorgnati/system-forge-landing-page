name = "newsletter-br"
main = "src/index.ts"
compatibility_date = "2026-03-26"

[[kv_namespaces]]
binding = "NEWSLETTER_KV"
id = "3502ec738f164c29ade29146a0767371"
preview_id = "957b83f697a64827a907d9aef9732bbc"

[[d1_databases]]
binding = "D1_AUDIT"
database_name = "newsletter-audit"
database_id = "85f58928-0f2a-4e72-881e-2ae337f1875c"

[vars]
