# Secrets — configurar via:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_AUDIENCE_ID_IT    (audience_id da lista "newsletter-it" no Resend)
#   wrangler secret put TURNSTILE_SECRET_KEY
# Nunca committar secrets no wrangler.toml
