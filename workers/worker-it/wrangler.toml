name = "newsletter-it"
main = "src/index.ts"
compatibility_date = "2026-03-26"

[[kv_namespaces]]
binding = "NEWSLETTER_KV"
id = "5125d8d64e444767bded6c787fb6e19f"
preview_id = "d1d28700120a446bb62216f45db90ada"

[[d1_databases]]
binding = "D1_AUDIT"
database_name = "newsletter-audit"
